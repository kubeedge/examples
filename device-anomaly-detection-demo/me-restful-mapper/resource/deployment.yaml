apiVersion: apps/v1
kind: Deployment
metadata:
  name: me-restful-mapper
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: me-restful-mapper
  template:
    metadata:
      labels:
        app: me-restful-mapper
    spec:
      nodeName: hadoop2
      containers:
        - name: me-restful-mapper
          volumeMounts: # Required, mapper need to communicate with grpcclient and get the config
            - name: kubeedge-volume
              mountPath: /etc/kubeedge
            - name: config
              mountPath: /tmp
          image: huajuan6848/me-restful-mapper:1.0.0
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: 300m
              memory: 500Mi
            requests:
              cpu: 100m
              memory: 100Mi
          command: [ "/bin/sh","-c" ]
          args: [ "/kubeedge/main --config-file /tmp/config.yaml --v 4" ]
      volumes:
        - name: kubeedge-volume
          hostPath:
            path: /etc/kubeedge
            type: Directory
        - name: config
          configMap:
            name: cm-mapper
            items:
              - key: configData
                path: config.yaml
