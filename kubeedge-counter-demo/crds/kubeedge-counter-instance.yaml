apiVersion: devices.kubeedge.io/v1beta1
kind: Device
metadata:
  name: counter
  namespace: default
  labels:
    description: "counter"
spec:
  deviceModelRef:
    name: counter-model
  nodeName: anode-ultraman
  properties:
    - name: status
      desired:
        value: "OFF"
      collectCycle: 1000
      reportCycle: 1000 
      reportToCloud: true
